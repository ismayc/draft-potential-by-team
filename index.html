<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NBA Draft Potential by Team</title>
    <meta
      name="description"
      content="An unofficial NBA draft viewer — every lottery with pre-lottery odds and results, plus the full two-round draft board with career outcomes, for every draft since 1989."
    />
    <meta name="theme-color" content="#0f0e0d" />
    <!-- Relative paths throughout: this ships to GitHub Pages under a repo
         subpath, so a leading slash would break it. Favicon is the family's
         shared emoji data URI (see basketball-analysis-tools/family_brand.py). -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏀</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <meta property="og:title" content="NBA Draft Potential by Team" />
    <meta
      property="og:description"
      content="Every NBA draft lottery with odds and results, plus the full two-round draft board with career outcomes, since 1989."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ismayc.github.io/draft-potential-by-team/" />
    <meta property="og:site_name" content="Basketball Data Science" />
    <meta property="og:image" content="https://ismayc.github.io/basketball-data-science/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://ismayc.github.io/basketball-data-science/og-image.png" />

    <script>
      // Resolve the theme before first paint. Doing this in React would mean a
      // frame of the wrong background — a white flash on a dark-theme device.
      ;(function () {
        try {
          var t = localStorage.getItem('dpt:theme')
          if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          document.documentElement.dataset.theme = t
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
