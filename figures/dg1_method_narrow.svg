<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 360 668" role="img" aria-label="How the analysis prices a pick and scores who drafted it: 1,562 picks from the 1989-2015 classes"><title>How the analysis prices a pick and scores who drafted it: 1,562 picks from the 1989-2015 classes</title><defs><marker id="dg-arrow-708d715fde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><rect x="12" y="12" width="336" height="82" class="dg-f-surface2 dg-s-rule" rx="6" stroke-width="1"/><circle cx="34" cy="34" r="11" class="dg-f-accent"/><text x="34" y="39" font-size="13" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">1</text><text x="54" y="40" font-size="15" class="dg-f-ink dg-text" font-weight="600">1,562 picks</text><text x="26" y="64" font-size="13" class="dg-f-ink2 dg-text">classes 1989-2015, each with</text><text x="26" y="82" font-size="13" class="dg-f-ink2 dg-text">ten full NBA seasons</text><line x1="180" y1="96" x2="180" y2="116" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-708d715fde)"/><rect x="12" y="120" width="336" height="118" class="dg-f-surface2 dg-s-rule" rx="6" stroke-width="1"/><circle cx="34" cy="142" r="11" class="dg-f-accent"/><text x="34" y="147" font-size="13" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">2</text><text x="54" y="148" font-size="15" class="dg-f-ink dg-text" font-weight="600">Price each slot</text><text x="26" y="172" font-size="13" class="dg-f-ink2 dg-text">average career Win Shares by</text><text x="26" y="190" font-size="13" class="dg-f-ink2 dg-text">pick, never rising with a</text><text x="26" y="208" font-size="13" class="dg-f-ink2 dg-text">later pick: 77 at pick 1,</text><text x="26" y="226" font-size="13" class="dg-f-ink2 dg-text">2 at pick 60</text><line x1="180" y1="240" x2="180" y2="260" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-708d715fde)"/><rect x="12" y="264" width="336" height="82" class="dg-f-surface2 dg-s-rule" rx="6" stroke-width="1"/><circle cx="34" cy="286" r="11" class="dg-f-accent"/><text x="34" y="291" font-size="13" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">3</text><text x="54" y="292" font-size="15" class="dg-f-ink dg-text" font-weight="600">Score each pick</text><text x="26" y="316" font-size="13" class="dg-f-ink2 dg-text">career Win Shares minus</text><text x="26" y="334" font-size="13" class="dg-f-ink2 dg-text">its slot&#x27;s price</text><line x1="180" y1="348" x2="180" y2="368" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-708d715fde)"/><rect x="12" y="372" width="336" height="74" class="dg-f-surface dg-s-nba" rx="6" stroke-width="1.5"/><text x="26" y="396" font-size="15" class="dg-f-nba dg-text" font-weight="600">Franchises</text><text x="26" y="416" font-size="13" class="dg-f-ink2 dg-text">sum of their picks&#x27; scores,</text><text x="26" y="434" font-size="13" class="dg-f-ink2 dg-text">with a 95% interval</text><rect x="12" y="456" width="336" height="74" class="dg-f-surface dg-s-nba" rx="6" stroke-width="1.5"/><text x="26" y="480" font-size="15" class="dg-f-nba dg-text" font-weight="600">Colleges</text><text x="26" y="500" font-size="13" class="dg-f-ink2 dg-text">8+ draftees; a hit is a</text><text x="26" y="518" font-size="13" class="dg-f-ink2 dg-text">career of 10,000+ minutes</text><rect x="12" y="540" width="336" height="74" class="dg-f-surface dg-s-nba" rx="6" stroke-width="1.5"/><text x="26" y="564" font-size="15" class="dg-f-nba dg-text" font-weight="600">Steals</text><text x="26" y="584" font-size="13" class="dg-f-ink2 dg-text">single picks furthest</text><text x="26" y="602" font-size="13" class="dg-f-ink2 dg-text">above their price</text><text x="12" y="638" font-size="13" class="dg-f-ink3 dg-text">Python and R each build every table;</text><text x="12" y="656" font-size="13" class="dg-f-ink3 dg-text">the reconcile gate holds them equal.</text></svg>
