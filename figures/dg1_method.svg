<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 760 326" role="img" aria-label="How the analysis prices a pick and scores who drafted it: 1,562 picks from the 1989-2015 classes"><title>How the analysis prices a pick and scores who drafted it: 1,562 picks from the 1989-2015 classes</title><defs><marker id="dg-arrow-cbf60fb5c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><rect x="16" y="16" width="220" height="132" class="dg-f-surface2 dg-s-rule" rx="6" stroke-width="1"/><circle cx="38" cy="40" r="12" class="dg-f-accent"/><text x="38" y="45" font-size="14" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">1</text><text x="58" y="46" font-size="16" class="dg-f-ink dg-text" font-weight="600">1,562 picks</text><text x="30" y="74" font-size="14" class="dg-f-ink2 dg-text">classes 1989-2015, each with</text><text x="30" y="94" font-size="14" class="dg-f-ink2 dg-text">ten full NBA seasons</text><line x1="239" y1="82" x2="263" y2="82" stroke-width="1.6" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-cbf60fb5c2)"/><rect x="266" y="16" width="220" height="132" class="dg-f-surface2 dg-s-rule" rx="6" stroke-width="1"/><circle cx="288" cy="40" r="12" class="dg-f-accent"/><text x="288" y="45" font-size="14" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">2</text><text x="308" y="46" font-size="16" class="dg-f-ink dg-text" font-weight="600">Price each slot</text><text x="280" y="74" font-size="14" class="dg-f-ink2 dg-text">average career Win Shares by</text><text x="280" y="94" font-size="14" class="dg-f-ink2 dg-text">pick, never rising with a</text><text x="280" y="114" font-size="14" class="dg-f-ink2 dg-text">later pick: 77 at pick 1,</text><text x="280" y="134" font-size="14" class="dg-f-ink2 dg-text">2 at pick 60</text><line x1="489" y1="82" x2="513" y2="82" stroke-width="1.6" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-cbf60fb5c2)"/><rect x="516" y="16" width="220" height="132" class="dg-f-surface2 dg-s-rule" rx="6" stroke-width="1"/><circle cx="538" cy="40" r="12" class="dg-f-accent"/><text x="538" y="45" font-size="14" class="dg-f-surface dg-text" text-anchor="middle" font-weight="700">3</text><text x="558" y="46" font-size="16" class="dg-f-ink dg-text" font-weight="600">Score each pick</text><text x="530" y="74" font-size="14" class="dg-f-ink2 dg-text">career Win Shares minus</text><text x="530" y="94" font-size="14" class="dg-f-ink2 dg-text">its slot&#x27;s price</text><path d="M626.0,148 C626.0,182 126.0,174 126.0,204" stroke-width="1.3" class="dg-f-none dg-s-ink3" marker-end="url(#dg-arrow-cbf60fb5c2)"/><rect x="16" y="208" width="220" height="78" class="dg-f-surface dg-s-nba" rx="6" stroke-width="1.5"/><text x="30" y="234" font-size="16" class="dg-f-nba dg-text" font-weight="600">Franchises</text><text x="30" y="256" font-size="14" class="dg-f-ink2 dg-text">sum of their picks&#x27; scores,</text><text x="30" y="275" font-size="14" class="dg-f-ink2 dg-text">with a 95% interval</text><path d="M626.0,148 C626.0,182 376.0,174 376.0,204" stroke-width="1.3" class="dg-f-none dg-s-ink3" marker-end="url(#dg-arrow-cbf60fb5c2)"/><rect x="266" y="208" width="220" height="78" class="dg-f-surface dg-s-nba" rx="6" stroke-width="1.5"/><text x="280" y="234" font-size="16" class="dg-f-nba dg-text" font-weight="600">Colleges</text><text x="280" y="256" font-size="14" class="dg-f-ink2 dg-text">8+ draftees; a hit is a</text><text x="280" y="275" font-size="14" class="dg-f-ink2 dg-text">career of 10,000+ minutes</text><path d="M626.0,148 C626.0,182 626.0,174 626.0,204" stroke-width="1.3" class="dg-f-none dg-s-ink3" marker-end="url(#dg-arrow-cbf60fb5c2)"/><rect x="516" y="208" width="220" height="78" class="dg-f-surface dg-s-nba" rx="6" stroke-width="1.5"/><text x="530" y="234" font-size="16" class="dg-f-nba dg-text" font-weight="600">Steals</text><text x="530" y="256" font-size="14" class="dg-f-ink2 dg-text">single picks furthest</text><text x="530" y="275" font-size="14" class="dg-f-ink2 dg-text">above their price</text><text x="16" y="312" font-size="14" class="dg-f-ink3 dg-text">Python and R each build every table; the reconcile gate holds them equal.</text></svg>
